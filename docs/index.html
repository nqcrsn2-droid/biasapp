<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Market Bias</title>
<meta name="theme-color" content="#16171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-b-180.png">
<link rel="icon" href="icons/icon-b-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --text:#f4f6fb; --sub:rgba(235,240,250,.74); --dim:rgba(235,240,250,.52); --faint:rgba(235,240,250,.34);
  --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.15); --hi:rgba(255,255,255,.22); --sel:rgba(255,255,255,.15);
  --row:rgba(255,255,255,.07); --track:rgba(0,0,0,.28); --bar:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.35); --solid:rgba(16,19,28,.9);
  --up:#5ef2b0; --down:#ff6b8b; --flat:#a7b0c0; --amber:#ffc35a; --accent:#ffffff;
  --blob1:rgba(255,107,139,.5); --blob2:rgba(60,110,255,.42); --blob3:rgba(0,200,170,.2); --blob4:transparent;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; --mono:var(--sans);
  --pad:16px; --gap:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 100px);min-height:100vh}
body{position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;transition:background 1.2s ease;
  background:radial-gradient(42% 32% at 12% 30%,var(--blob1),transparent 70%),radial-gradient(48% 36% at 95% 4%,var(--blob2),transparent 70%),
             radial-gradient(40% 30% at 90% 78%,var(--blob3),transparent 70%),radial-gradient(34% 26% at 32% 46%,var(--blob4),transparent 70%)}
:root[data-mode="vivid"] body::before{display:none}
.mesh{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;display:none}
:root[data-mode="vivid"] .mesh{display:block}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);transform:translateZ(0)}
.mesh i:nth-child(1){width:520px;height:520px;left:-210px;top:150px;background:#ff1f5a;opacity:.95}
.mesh i:nth-child(2){width:560px;height:560px;right:-240px;top:-120px;background:#2a4bff;opacity:.95}
.mesh i:nth-child(3){width:420px;height:420px;left:40px;top:330px;background:#c21bd6;opacity:.55}
.mesh i:nth-child(4){width:460px;height:460px;right:-200px;top:780px;background:#00c49a;opacity:.55}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
#fx[hidden]{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num,.stamps,.rows .r > span:last-child,.ev .t,.big b,.fl{font-variant-numeric:tabular-nums}

/* glass */
.g,.card,.hero,.tabbar,.glass,.sheet,.toast,.big > div{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 12px 40px var(--shadow)}

/* header */
header{padding:12px 0 2px}
.top,.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{margin-top:10px}
.btns{display:flex;gap:8px}
.segc{display:flex;padding:3px;border-radius:999px;gap:2px}
.segc button{font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.segc button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ib svg{width:18px;height:18px}
.spin svg{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:none}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.live.stale{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.ptitle{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:22px 4px 4px}
.psub{font-size:14px;color:var(--dim);line-height:1.5;margin:0 4px}

/* hero */
.hero{margin-top:16px;border-radius:30px;padding:20px 20px 18px}
.kicker{font-size:13.5px;color:var(--dim);font-weight:500;display:flex;align-items:center;gap:8px}
.bias{font-size:62px;font-weight:700;letter-spacing:-.045em;line-height:1.02;margin:8px 0 8px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 68%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent}
.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.tug{margin-top:22px}
.track{position:relative;display:flex;height:22px;border-radius:999px;padding:4px;background:var(--track);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.side{width:50%;display:flex;gap:2px}
.side.bear{flex-direction:row-reverse;padding-right:3px}
.side.bull{padding-left:3px}
.side i{display:block;height:100%;border-radius:999px}
.needle{position:absolute;top:-6px;bottom:-6px;width:8px;margin-left:-4px;border-radius:999px;background:var(--text);
  box-shadow:0 0 0 3px var(--sel),0 2px 10px rgba(0,0,0,.4);animation:nd .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes nd{from{left:50%}}
.tl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:10px;font-weight:500}
.note{font-size:15.5px;color:var(--sub);margin-top:16px;line-height:1.5}
.note b{color:var(--text);font-weight:600}
.flipv{margin-top:12px;font-size:13.5px;color:var(--sub);padding:10px 12px;border-radius:14px;background:var(--bar)}
.mode{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.5}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--row)}
.stamps div{font-size:13.5px;font-weight:600}
.stamps span{display:block;font-size:12px;color:var(--faint);font-weight:500}
.stamps em{display:block;font-style:normal;font-size:12px;color:var(--dim);font-weight:500}
.stamps .warn{grid-column:1/-1;color:var(--amber)}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{opacity:.35}100%{opacity:1}}

/* widget grid */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.t{border-radius:28px;padding:16px;min-width:0;text-align:left}
.t.wide{grid-column:1/-1}
.lbl{font-size:12.5px;font-weight:600;color:var(--dim)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 16px}
.tc{font-size:16px;font-weight:650}
.callword{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}
.conv-pill{margin-bottom:6px}
.hero-t .tug{margin-top:0}
.tv{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:8px}
.ts{font-size:12.5px;color:var(--dim);margin-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--row)}
.mrow:nth-child(2){border-top:0}
.mrow span:last-child{font-weight:650}
.mini-call{cursor:pointer;font:inherit;color:inherit}
.mini-call .tc{font-size:20px;font-weight:700;margin-top:8px}
.t .stamps{border-top:1px solid var(--row)}
body.compact .callword{font-size:42px}

/* blocks */
section{margin-top:var(--gap)}
h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{border-radius:24px;overflow:hidden}
.pad{padding:var(--pad)}
.idea{font-size:15.5px;line-height:1.5}
.inval{margin-top:12px;font-size:14px;color:var(--dim)}
.inval b{color:var(--text);font-weight:600}
.pill{font-size:12.5px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);white-space:nowrap}
.grp{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 4px}
.grp span:last-child{font-weight:500;color:var(--faint)}
.sig{padding:12px var(--pad);border-top:1px solid var(--row)}
.grp + .sig{border-top:0}
.sig-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sig h3{font-size:15.5px;font-weight:600}
.sig p{font-size:13.5px;line-height:1.45;color:var(--dim);margin-top:3px}
.w{font-size:12px;color:var(--faint);margin-left:6px;font-weight:500}
.nov{flex:none;font-size:11px;font-weight:600;color:var(--dim);padding:3px 8px;border-radius:99px;background:var(--bar)}
.wtag{all:unset;font-size:12px;color:var(--faint);margin-left:6px;font-weight:500;font-style:normal}
.vbar{flex:none;position:relative;width:70px;height:6px;border-radius:999px;background:var(--bar)}
.vbar i{position:absolute;top:0;bottom:0;border-radius:999px}
.ico{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid;display:grid;place-items:center;font-size:13px;font-weight:700}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.rows .r:first-child{border-top:0}
.rows .r > span:first-child{color:var(--sub)}
.rows .r > span:last-child{font-weight:600;text-align:right}
.rows small{display:block;font-size:12px;color:var(--faint);font-weight:500}
.flowbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 8px;gap:2px}
.fl{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
svg.prof{display:block;width:100%;height:150px}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);gap:6px}
.ev{display:flex;gap:14px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.ev:first-child{border-top:0}
.ev .t{color:var(--dim);width:68px;flex:none;font-weight:500}
.ev small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.dayhead{font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 2px;border-top:1px solid var(--row)}
.card > .dayhead:first-child{border-top:0}
.dayhead.today{color:var(--text)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.foot{font-size:13px;line-height:1.6;color:var(--dim);margin:0 4px}
.foot p{margin-bottom:10px}
.foot b{color:var(--sub);font-weight:600}
.err{color:var(--amber);font-size:13px;line-height:1.6}
.empty{padding:80px 4px;color:var(--dim);font-size:16px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);font-size:15px;font-weight:600}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

/* record */
.big{display:flex;gap:10px}
.big > div{flex:1;border-radius:24px;padding:16px}
.big b{display:block;font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.big span{font-size:13px;font-weight:600;color:var(--dim)}
.big small{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
.bar{height:6px;border-radius:999px;background:var(--bar);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:999px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:var(--pad)}
.dots span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#05070d;font-weight:700}

/* research */
details.rs{border-top:1px solid var(--row)}
.card > details.rs:first-child{border-top:0}
details.rs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px var(--pad);cursor:pointer}
details.rs summary::-webkit-details-marker{display:none}
details.rs summary h3{flex:1;font-size:15.5px;font-weight:600}
details.rs summary em{font-style:normal;font-size:16px;color:var(--faint);transition:transform .2s}
details.rs[open] summary em{transform:rotate(90deg)}
.rsb{padding:0 var(--pad) 16px 50px;font-size:14px;line-height:1.55;color:var(--sub)}
.rsb p{margin-top:8px}
.rsb b{color:var(--text);font-weight:600}
.rsb .paper{font-size:12.5px;color:var(--dim)}

/* journal */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--track);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:1;min-width:80px;font-size:14px;font-weight:600;padding:10px 6px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.chips button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.jrow{padding:12px var(--pad);border-top:1px solid var(--row);font-size:14.5px}
.jst{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.jst > div{padding:14px 16px;border-top:1px solid var(--row)}
.jst > div:nth-child(2n){border-left:1px solid var(--row)}
.jst .jw{grid-column:1/-1;border-top:0}
.jst > div:nth-child(n+2):nth-child(2n+1){border-left:1px solid var(--row)}
.jst span{font-size:12.5px;color:var(--dim);font-weight:600}
.jst b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.jst .jw b{font-size:38px}
.jst small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.field select{width:100%;background:var(--track);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;font-size:16px;appearance:none}
.calb{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 12px;border-radius:16px;background:rgba(255,95,95,.12);border:1px solid rgba(255,95,95,.35)}.calb .dot{width:9px;height:9px;border-radius:50%;background:var(--down);flex:none}.calb div{flex:1;font-size:14.5px}.calb small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.calb b.num{color:var(--down);white-space:nowrap}
.rules{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px!important;min-height:200px;white-space:pre-wrap;line-height:1.45}
.btHelp{margin-top:12px;font-size:13.5px;color:var(--dim)}.btHelp summary{cursor:pointer;font-weight:600}.btHelp div{margin-top:8px;line-height:1.7}.btHelp code{background:var(--track);padding:1px 5px;border-radius:5px;font-size:12.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.jrng{display:flex;gap:4px;background:var(--bar);border-radius:10px;padding:3px}
.jrng button{font-size:12px;font-weight:600;color:var(--dim);padding:5px 9px;border-radius:7px}
.jrng button.on{background:var(--sel);color:var(--text)}
.mcbox{background:#0b0c10;border:1px solid #23252e;border-radius:22px;padding:18px 14px 16px;color:#e9eaf0}
.mct{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-align:center}.mct span{color:#9aa0ad}
.mcs{font-size:11.5px;color:#7d8290;text-align:center;margin:6px 0 10px}
.mch{background:#181a21;margin:0 auto 10px;width:max-content}.mch button{color:#8a8f9c}.mch button.on{background:#2a2d37;color:#fff}
.mcread{font-size:12.5px;color:#c9ccd5;text-align:center;margin-top:8px;min-height:18px}.mcread b{color:#fff}
.mcleg{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:11.5px;color:#a3a8b4;margin-top:10px}
.mcleg span{display:flex;align-items:center;gap:6px}.mcleg i{display:inline-block;width:16px;height:9px;border-radius:2px}
.mcg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#23252e;border-radius:14px;overflow:hidden;margin-top:14px}
.mcg > div{background:#111318;padding:10px 12px}.mcg span{font-size:11.5px;color:#8a8f9c}.mcg b{display:block;font-size:18px;margin-top:2px}

.jrow:first-child{border-top:0}
.jrow .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.jrow p{margin-top:6px;color:var(--sub);line-height:1.5}
.jrow .del{color:var(--faint);font-size:13px;margin-top:6px}

/* floating tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:12;
  width:calc(100% - 32px);max-width:528px;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--solid)}
.tabbar button{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:10px 0;border-radius:999px;transition:background .2s,color .2s}
.tabbar button svg{display:none}
.tabbar button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}

/* "More" panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.glass{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:22;width:calc(100% - 32px);max-width:528px;
  transform:translate(-50%,16px) scale(.97);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);
  padding:8px 18px 6px;border-radius:28px;background:var(--solid)}
.glass.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.glass h4{font-size:13px;font-weight:600;color:var(--dim);margin:8px 0 2px;display:flex;justify-content:space-between}
.glass{display:flex;flex-direction:column;max-height:calc(100dvh - env(safe-area-inset-bottom) - 150px)}
.glass .tiles{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1}
.gsearch{display:flex;align-items:center;gap:8px;margin:8px 0 4px;padding:0 12px;height:40px;border-radius:12px;background:var(--bar)}
.gsearch svg{width:17px;height:17px;color:var(--dim);flex:none}
.gsearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.gnone{padding:16px 0;color:var(--dim);font-size:14px}
.fstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 0 0;padding:0 20px 4px 0;scrollbar-width:none}
.fstrip::-webkit-scrollbar{display:none}
.fcard{flex:none;width:150px;scroll-snap-align:start;padding:14px 14px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);display:flex;flex-direction:column}
.fcard b{font-size:15.5px;font-weight:600}
.fcard .fc{font-size:13px;color:var(--dim);margin-top:2px}
.fcard i{display:block;border-top:1px dashed var(--line2);margin:10px 0 12px;opacity:.7}
.fcard svg{margin-bottom:8px}
.fcard .fp{font-size:17px;font-weight:600}
.fcard .fx{font-size:14px;margin-top:2px}
.mrow2{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:12px;padding:12px var(--pad);border-top:1px solid var(--row)}

.mrow2 .mvl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;white-space:nowrap;min-width:70px}.mrow2 .mvl b{font-size:15.5px}
.hp{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 16px;border-top:1px solid var(--row);color:var(--text)}
.hp:first-child{border-top:0}
.hpi{width:20px;height:20px;color:var(--dim);flex:none;margin-top:2px}.hpi svg{width:20px;height:20px}
.hpt{flex:1;min-width:0;text-align:left}
.tiles{display:flex;flex-direction:column}
.tiles button{display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left;border-top:1px solid var(--row)}
.tiles button:first-child{border-top:0}
.tiles svg{width:20px;height:20px;color:var(--dim);flex:none}
.tiles span{display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px}
.tiles b{font-size:16px;font-weight:600}
.tiles small{font-size:13px;color:var(--dim)}
.tiles button.on svg,.tiles button.on b{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--solid);color:var(--text);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}

/* compact layout */
body.compact{--pad:12px;--gap:18px}
body.compact .sig p{display:none}
body.compact .sig{padding-top:10px;padding-bottom:10px}
body.compact .bias{font-size:50px}
body.compact .note{font-size:14.5px}

/* settings sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--solid);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25;padding:0 0 calc(env(safe-area-inset-bottom) + 20px)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;padding:0 18px}
.sh-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;z-index:1;background:transparent;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sh-top h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.hbtn{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.st{margin-top:20px}
.st h4{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:70px;font-size:14px;font-weight:600;padding:10px 8px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.seg button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.sw{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.sw i{width:10px;height:10px;border-radius:50%;display:inline-block}
.colors{display:flex;gap:8px;margin-top:8px}
.colors label{flex:1;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--dim);border-radius:999px;padding:6px 8px 6px 14px;background:var(--bar)}
.colors input{width:30px;height:24px;border:0;background:none;padding:0}
.secrow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--row);font-size:15px}
.secrow:first-child{border-top:0}
.secrow span{flex:1}
.mv{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:14px;background:var(--bar)}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bar);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--up)}
.tg.on::after{transform:translateX(20px)}
.rng{display:grid;gap:4px}
.rng label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--dim);margin-top:8px}
.rng output{color:var(--text);font-variant-numeric:tabular-nums}
.rng input[type=range]{width:100%;height:28px;accent-color:var(--text)}
.reset{width:100%;margin-top:20px;padding:13px;border-radius:999px;color:var(--down);font-size:15px;font-weight:600;background:var(--bar)}

/* colour-only themes: same layout as Calm, different paint */
:root[data-mode="wc"] body::before{inset:0;background:radial-gradient(120% 55% at 85% -5%,var(--blob1),transparent 62%),radial-gradient(90% 40% at 0% 100%,color-mix(in srgb,var(--blob1) 35%,transparent),transparent 70%)}
:root[data-mode="qc"] body::before{display:none}
:root[data-mode="qc"] .g,:root[data-mode="qc"] .card,:root[data-mode="qc"] .tabbar,:root[data-mode="qc"] .glass,:root[data-mode="qc"] .sheet,:root[data-mode="qc"] .big>div,:root[data-mode="qc"] .pop{
  -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
:root[data-mode="qc"] .live{box-shadow:none}
/* ───────── calm: flat, easy on the eyes, three colors ───────── */
:root[data-mode="calm"] body::before{display:none}
:root[data-mode="calm"] .g,:root[data-mode="calm"] .card,:root[data-mode="calm"] .hero,:root[data-mode="calm"] .tabbar,:root[data-mode="calm"] .glass,
:root[data-mode="calm"] .sheet,:root[data-mode="calm"] .toast,:root[data-mode="calm"] .big>div,:root[data-mode="calm"] .pop,:root[data-mode="calm"] .pc{

:root[data-mode="calm"] .vbar i,:root[data-mode="calm"] .side i{box-shadow:none!important}
:root[data-mode="calm"] .needle{box-shadow:0 0 0 3px var(--bg)}
:root[data-mode="calm"] .chip,:root[data-mode="calm"] .pill{background:var(--sel);border-color:transparent;color:#C9D7FA}
:root[data-mode="calm"] .t .more{color:var(--accent)}
:root[data-mode="calm"] .px{background:#2A2C36}
:root[data-mode="calm"] .scrim{background:rgba(8,9,12,.55)}
:root[data-mode="calm"]{--amb:#7AA2F7}
:root[data-mode="calm"] .tline > div{background:#262833!important;color:var(--dim)!important}
:root[data-mode="calm"] .tline > div:nth-child(3){background:var(--accent)!important;color:#16171D!important}
.ckp{padding-top:14px;display:flex;flex-direction:column;gap:10px}

.ckax span:nth-child(2){transform:translateX(-50%)}
.ckrows{padding:6px 10px}

.ckn{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--row);font-size:14.5px}

/* news */
.nw{display:block;color:inherit;text-decoration:none}

.nw-hero .nb{padding:14px 16px 16px}
.nw-hero h3{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:0}

.nw-meta b{color:var(--accent);font-weight:600}
.nw-sum{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.4}

/* ladder */
.ld{display:grid;grid-template-columns:auto 1fr auto;gap:0;font-size:14.5px}
.ld div{padding:8px 0;border-top:1px solid var(--row)}
.ld .k{color:var(--dim)} .ld .v{text-align:right;font-variant-numeric:tabular-nums}
.ld .bar{padding:8px 12px}
.ld .bar i{display:block;height:6px;border-radius:3px;margin-top:6px}
/* ───────── tappable tiles + big popup ───────── */
button.t{display:block;width:100%;font:inherit;color:inherit;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
button.t:active{transform:scale(.97)}
.t .more{margin-left:auto;color:var(--faint);font-size:15px;line-height:1}
.pop{position:fixed;z-index:27;left:50%;width:calc(100% - 20px);max-width:540px;top:calc(env(safe-area-inset-top) + 34px);bottom:calc(env(safe-area-inset-bottom) + 14px);
  transform:translate(-50%,40px) scale(.96);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .2s;
  border-radius:32px;background:color-mix(in srgb,var(--solid) 82%,transparent);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),0 30px 80px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%)}
.pop.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.px{position:absolute;top:14px;right:14px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sel);border:1px solid var(--edge);color:var(--text)}

.pt{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.ps{font-size:14px;color:var(--sub);margin-top:2px}
.ph{font-size:13px;font-weight:600;color:var(--dim);margin:18px 4px 8px}
.pc{margin-top:12px;border-radius:20px;padding:12px 14px;background:var(--glass);border:1px solid var(--edge)}
.pc .tug{margin-top:4px}
.ph + .pc{margin-top:0}
.rows0{padding-top:2px;padding-bottom:2px}
.pr{padding:10px 0;border-top:1px solid var(--row)}
.pr:first-child{border-top:0}

/* ───────── quant desk ───────── */
:root{--qm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --qd:"Inter Tight",var(--sans); --amb:#FFB000}
:root[data-mode="quant"]{--sans:var(--qm)}
:root[data-mode="quant"] body::before{display:none}
:root[data-mode="quant"] html,:root[data-mode="quant"] body{font-size:13px;letter-spacing:0}
:root[data-mode="quant"] .wrap{padding:0}
:root[data-mode="quant"] .g,:root[data-mode="quant"] .card,:root[data-mode="quant"] .big>div,:root[data-mode="quant"] .toast{
  background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border:0;border-radius:0}
:root[data-mode="quant"] .card{border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
:root[data-mode="quant"] .toast{background:#16181B;border:1px solid var(--edge);border-radius:4px}
:root[data-mode="quant"] .tabbar{left:0;right:0;transform:none;bottom:0;width:100%;max-width:none;border-radius:0;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);
  background:var(--bg);border:0;border-top:1px solid var(--edge);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-mode="quant"] .tabbar button{font-size:11.5px;font-weight:500;border-radius:0;padding:6px 0;text-transform:lowercase}
:root[data-mode="quant"] .tabbar button.on{background:none;box-shadow:none;color:var(--amb)}
:root[data-mode="quant"] .tabbar button.on::before{content:"["}
:root[data-mode="quant"] .tabbar button.on::after{content:"]"}
:root[data-mode="quant"] .glass,:root[data-mode="quant"] .sheet{background:#101214;border:1px solid var(--edge);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px}
:root[data-mode="quant"] .sheet{border-radius:8px 8px 0 0}
:root[data-mode="quant"] .glass{bottom:calc(env(safe-area-inset-bottom) + 58px)}
:root[data-mode="quant"] header{padding:10px 16px 8px;border-bottom:1px solid var(--edge)}
:root[data-mode="quant"] .segc{background:none;border:0;box-shadow:none;padding:0;gap:0;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-mode="quant"] .segc button{font-size:12.5px;font-weight:500;padding:4px 0;border-radius:0;color:var(--dim)}
:root[data-mode="quant"] .segc button.on{background:none;box-shadow:none;color:var(--amb)}
:root[data-mode="quant"] #tabs button + button::before{content:"/";color:var(--faint);margin:0 6px}
:root[data-mode="quant"] #vt{padding-left:10px;margin-left:10px;border-left:1px solid var(--edge)}
:root[data-mode="quant"] #vt button + button::before{content:"·";color:var(--faint);margin:0 7px}
:root[data-mode="quant"] .tab .dot{display:none}
:root[data-mode="quant"] .ib{width:28px;height:28px;border-radius:4px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--dim)}
:root[data-mode="quant"] .ib svg{width:15px;height:15px}
:root[data-mode="quant"] section{margin-top:18px}
:root[data-mode="quant"] h2{font-family:var(--qm);font-size:11px;font-weight:500;color:var(--dim);letter-spacing:0;margin:0 16px 6px;text-transform:lowercase}
:root[data-mode="quant"] .ptitle{font-family:var(--qd);font-size:26px;margin:16px 16px 2px}
:root[data-mode="quant"] .psub,:root[data-mode="quant"] .foot{margin:0 16px}
:root[data-mode="quant"] .pill,:root[data-mode="quant"] .chip,:root[data-mode="quant"] .hbtn{border-radius:3px;background:none}
:root[data-mode="quant"] .rows .r,:root[data-mode="quant"] .ev,:root[data-mode="quant"] .sig,:root[data-mode="quant"] .jrow{font-size:12.5px;padding:8px 16px}
:root[data-mode="quant"] .sig h3,:root[data-mode="quant"] details.rs summary h3{font-size:12.5px;font-weight:500}
:root[data-mode="quant"] .sig p{font-size:11.5px}
:root[data-mode="quant"] .btn,:root[data-mode="quant"] .seg button,:root[data-mode="quant"] .chips button,:root[data-mode="quant"] .colors label,:root[data-mode="quant"] .reset,:root[data-mode="quant"] .mv{border-radius:3px}

:root[data-mode="quant"] .dots span{border-radius:2px}
:root[data-mode="quant"] .field input,:root[data-mode="quant"] .field textarea{border-radius:3px}

.bwb{flex:1;overflow:hidden;padding:4px 14px 12px;min-height:0;font-size:14px}

  .t-bias{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:0 3cqw;align-items:center}
  .t-bias .bbig{font-size:clamp(30px,min(13cqw,40cqh),240px)}

}

/* quant desk factor table */
.qft{display:grid;grid-template-columns:minmax(0,1.3fr) 64px minmax(0,1.6fr);gap:8px;align-items:center;padding:3px 0;list-style:none;cursor:pointer}
.qft::-webkit-details-marker{display:none}
.qf summary span:first-child{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qfb{position:relative;height:10px;background:linear-gradient(to right,transparent calc(50% - .5px),var(--edge) calc(50% - .5px),var(--edge) calc(50% + .5px),transparent calc(50% + .5px))}
.qfb i{position:absolute;top:1px;bottom:1px;border-radius:1px}
.qf p{margin:2px 0 8px;color:var(--sub);font-size:12.5px;line-height:1.45}
.qf[open] summary span:first-child{color:var(--amber)}

/* ───────── time helpers ───────── */
const tET = d => d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+' ET';
/* ───────── viewer's time zone ─────────
   The model runs on Central time. Every time shown is converted to the viewer's own zone: the formatters below
   use it directly, and LOCALIZE rewrites any "… CT" time written into page text or the report. */
const USER_TZ = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago'; }catch(e){ return 'America/Chicago'; } })();
const TZ_LABEL = (()=>{ try{
  const n = new Intl.DateTimeFormat('en-US',{timeZone:USER_TZ,timeZoneName:'short'}).formatToParts(new Date()).find(x=>x.type==='timeZoneName').value;
  return ({EST:'ET',EDT:'ET',CST:'CT',CDT:'CT',MST:'MT',MDT:'MT',PST:'PT',PDT:'PT',AKST:'AKT',AKDT:'AKT',HST:'HT'})[n] || n;
}catch(e){ return 'CT'; } })();
const tzOff = (tz, d=new Date()) => { const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
  return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute) - Math.floor(d.getTime()/60000)*60000)/60000; };
const TZ_SHIFT = tzOff(USER_TZ) - tzOff('America/Chicago');   // minutes to add to a Central time
const IS_CT = TZ_SHIFT===0 && TZ_LABEL==='CT';
function fmtMin(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60; return `${h%12||12}${mi?':'+String(mi).padStart(2,'0'):''} ${h<12?'AM':'PM'}`; }
// "8:30 to 11 AM CT", "5 PM–2 AM CT", "02:00–08:00 CT", "8:25 CT", "4:55 PM CT" → the viewer's zone
const CT_RE = /\b(\d{1,2})(?::(\d{2}))?(?:\s*(AM|PM))?(?:(\s*(?:to|–|-)\s*)(\d{1,2})(?::(\d{2}))?(?:\s*(AM|PM))?)?\s+CT\b/g;
function ctMin(h, mi, ap, raw){ h=+h; mi=+(mi||0);
  if(!ap){ if(raw.length===2 && raw[0]==='0' || h>=13) return h*60+mi;   // 24-hour style
    ap = (h>=7 && h<=11) ? 'AM' : 'PM'; }                                 // bare market times: 7-11 morning, 12-6 afternoon
  return ((h%12)+(ap==='PM'?12:0))*60+mi; }
function localizeText(t){
  if(IS_CT || !t || t.indexOf('CT')<0) return t;
  return t.replace(CT_RE, (m, h1, m1, a1, sep, h2, m2, a2) => {
    if(h2!==undefined){ const ap1 = a1 || a2 || null;
      return `${fmtMin(ctMin(h1,m1,ap1,h1)+TZ_SHIFT)}${sep.includes('to')?' to ':'–'}${fmtMin(ctMin(h2,m2,a2,h2)+TZ_SHIFT)} ${TZ_LABEL}`; }
    return `${fmtMin(ctMin(h1,m1,a1,h1)+TZ_SHIFT)} ${TZ_LABEL}`; });
}
function LOCALIZE(root){
  if(IS_CT || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode()){ const v=n.nodeValue; if(v.indexOf('CT')>=0){ const r=localizeText(v); if(r!==v) n.nodeValue=r; } }
}
if(!IS_CT){ try{ new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') { const r=localizeText(m.target.nodeValue); if(r!==m.target.nodeValue) m.target.nodeValue=r; }
  else m.addedNodes.forEach(n=>n.nodeType===3 ? (n.nodeValue=localizeText(n.nodeValue)) : LOCALIZE(n)); } })
  .observe(document.documentElement,{childList:true,subtree:true,characterData:true}); }catch(e){} }
const tCT = d => d.toLocaleTimeString('en-US',{timeZone:USER_TZ,hour:'numeric',minute:'2-digit'})+' '+TZ_LABEL;
const tLocal = (d,sec) => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',...(sec?{second:'2-digit'}:{})});
const dayLocal = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayOf = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function ago(d){
  const m = Math.round((Date.now()-d)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago';
  const h=Math.floor(m/60); if(h<24) return h+' hr '+(m%60)+' min ago';
  const dd=Math.floor(h/24); return dd+' day'+(dd>1?'s':'')+' ago';
}
function nextRun(){   // mirrors the GitHub schedule (UTC): weekdays :07/:22/:37/:52 from 12 to 14, plus every hour at :40 Sun–Fri
  const now=new Date(), pre=[12,13,14].flatMap(h=>[7,22,37,52].map(m=>[h,m,true]));
  const slots=[...Array(24).keys()].map(h=>[h,40,false]).concat(pre).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  for(let i=0;i<10;i++) for(const [h,mi,weekdayOnly] of slots){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+i,h,mi)), wd=d.getUTCDay();
    if(weekdayOnly ? (wd>=1&&wd<=5) : wd<=5) if(d>now) return d;
  }
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }

const sessInfo = (k=SKEY) => { const S = ROOT && ROOT.sessions ? ROOT.sessions[k] : null; if(!S) return null;
  // open / upcoming / closed comes from the clock now, never from when the report was built (a stale report
  // would otherwise keep saying "open" for a session that ended days ago)
  const n = Date.now(), a = +new Date(S.start), b = +new Date(S.end);
  return {...S, state: n < a ? 'upcoming' : n < b ? 'open' : 'closed', locked: n >= +new Date(S.lock)}; };
const dayIn = d => d.toLocaleDateString('en-US',{timeZone:USER_TZ,weekday:'short',month:'short',day:'numeric'});
/* How old the report is. Futures trade ~23h a day on weekdays, so a build more than 90 minutes old (outside the
   weekend shutdown) means the builder has stopped, and every price, level and call on screen is from then, not now. */
function reportAge(){ return ROOT && ROOT.generated ? Date.now() - Date.parse(ROOT.generated) : 0; }
function futuresShut(t=new Date()){ const q = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hourCycle:'h23',hour:'2-digit'}).formatToParts(t).map(x=>[x.type,x.value]));
  const h = +q.hour%24; return q.weekday==='Sat' || (q.weekday==='Fri' && h>=17) || (q.weekday==='Sun' && h<18); }
function outdated(){ if(!ROOT || !ROOT.generated) return false; const g = new Date(ROOT.generated), age = reportAge();
  if(age < 90*60e3) return false;
  // a Friday-evening build is still the latest one through the weekend shutdown
  return !(futuresShut() && futuresShut(new Date(g.getTime()+90*60e3))) ; }
function staleBanner(){ if(!outdated()) return ''; const g = new Date(ROOT.generated);

function defaultSession(){   // the session open right now, else the next one to open
  const S = ROOT && ROOT.sessions; if(!S) return 'ny';
  const now = Date.now(), list = Object.keys(S).map(k=>sessInfo(k));
  const open = list.filter(x=>new Date(x.start)<=now && now<new Date(x.end)).sort((a,b)=>new Date(b.start)-new Date(a.start));
  if(open.length) return open[0].key;
  const next = list.filter(x=>now<new Date(x.start)).sort((a,b)=>new Date(a.start)-new Date(b.start));
  if(next.length) return next[0].key;
  return list.slice().sort((a,b)=>new Date(b.end)-new Date(a.end))[0].key;   // all ended (stale report): the most recent
}

function winText(D){

function lockText(){

}

const BPRESETS = {
  desktop:{
    trader:{name:'Trader', w:[['bias',4,5],['session',4,5],['flip',4,5],['whybull',4,8],['whybear',4,8],['levels',4,8],['calendar',6,8],['news',6,8]]},

const B_RH = 40, B_GAP = 12;
let BRH = B_RH;   // live row height: the page is a fixed number of rows that always fills the screen exactly
const bRows = () => bDev()==='mobile' ? 24 : 21;
const bBottom = ws => Math.max(0, ...ws.map(w=>w.y+w.h));
const B_FILL = new Set(['session','levels','calendar','instrument']);   // row lists that stretch to fill their box
const bDev = () => window.innerWidth < 720 ? 'mobile' : 'desktop';
const bCols = dev => dev==='mobile' ? 4 : 12;
const bid = () => Math.random().toString(36).slice(2,9);
const bHit = (a,b) => a!==b && a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
// Gravity: every widget rises as far as it can, so there are never holes. `pin` stays exactly where it was put.
function bCompact(ws, pin){
  const placed = pin ? [pin] : [];
  for(const w of ws.filter(x=>x!==pin).sort((a,b)=>a.y-b.y || a.x-b.x)){
    w.y = 0;
    for(let hit; (hit = placed.find(p=>bHit(w,p))); ) w.y = hit.y + hit.h;
    placed.push(w);
  }
  return ws;
}
function bFlow(ws, cols){   // first placement for widgets that have no position yet: fill rows left to right
  const done = [];
  for(const w of ws){
    w.w = Math.max(1, Math.min(cols, w.w));
    if(w.x==null || w.y==null){ let ok=false;
      for(let y=0; !ok && y<400; y++) for(let x=0; x+w.w<=cols; x++){ w.x=x; w.y=y; if(!done.some(p=>bHit(w,p))){ ok=true; break; } }
    } else { w.x = Math.max(0, Math.min(cols-w.w, w.x)); }
    done.push(w);
  }
  return bCompact(ws);
}
function bFromPreset(dev, key, name){
  const p = BPRESETS[dev][key];
  return {id:bid(), name:name||p.name, widgets:bFlow(p.w.map(([type,w,h])=>({id:bid(), type, w, h})), bCols(dev))};
}
function bDefault(){
  return {v:2, updated:0,
    desktop:{active:null, pages:[bFromPreset('desktop','trader','My dashboard')]},
    mobile:{active:null, pages:[bFromPreset('mobile','essentials','My dashboard')]}};
}
function bClean(L){   // never trust stored shapes: drop unknown widgets, clamp sizes, keep at least one page
  const out = bDefault(); if(!L || typeof L!=='object') return out;
  const old = (+L.v||1) < 2;   // first version used 80px rows and a 2-column phone grid
  out.updated = +L.updated || 0;
  for(const dev of ['desktop','mobile']){
    const src = L[dev], cols = bCols(dev); if(!src || !Array.isArray(src.pages) || !src.pages.length) continue;
    const pages = src.pages.slice(0,12).map(p=>({id:String(p.id||bid()).slice(0,12), name:String(p.name||'Page').slice(0,40),
      widgets:bFlow((Array.isArray(p.widgets)?p.widgets:[]).filter(w=>w && BW[w.type]).slice(0,30).map(w=>{
        const d = BW[w.type][dev==='mobile'?'m':'d'];
        let ww = +w.w || d[0], hh = +w.h || d[1];
        if(old){ hh *= 2; if(dev==='mobile') ww *= 2; }
        return {id:String(w.id||bid()).slice(0,12), type:w.type, w:Math.max(1,Math.min(cols,ww)), h:Math.max(2,Math.min(30,hh)),
          x: old || w.x==null ? null : Math.max(0, +w.x||0), y: old || w.y==null ? null : Math.max(0, +w.y||0)}; }), cols)}));
    out[dev] = {active: pages.some(p=>p.id===src.active) ? src.active : pages[0].id, pages};
  }
  for(const dev of ['desktop','mobile']) if(!out[dev].active) out[dev].active = out[dev].pages[0].id;
  return out;
}

let BL = bClean(store.get('board', null)), BEDIT = false, BSYNC = null, BSYNC_T = null;

function bSave(){

  if(BSYNC===false) return;            // the account store isn't set up; this device keeps its own copy
  clearTimeout(BSYNC_T); BSYNC_T = setTimeout(async()=>{

      if(r.status===404 || r.status===501) BSYNC = false; else if(r.ok) BSYNC = true; }catch(e){}

async function bPull(){   // newest copy wins, so a change made on the phone shows up on the laptop and vice versa
  if(!location.pathname.startsWith('/app')) { BSYNC = false; return; }
  try{ const r = await fetch('/api/layout', {cache:'no-store'});
    if(r.status===404 || r.status===501){ BSYNC = false; return; }
    if(!r.ok) return; BSYNC = true;
    const j = await r.json(); if(j && j.layout && (+j.layout.updated||0) > (BL.updated||0)){ BL = bClean(j.layout); store.set('board', BL); if(PAGE==='board') render(); }
  }catch(e){}
}

          ${b.invalidation?`<div class="bxs"><div class="bk">Flips on</div><div class="bxr">${esc(b.invalidation)}</div></div>`:''}
          ${others?`<div class="bxs"><div class="bk">Other sessions</div><div class="bxo">${others}</div></div>`:''}</div>`; }

function bSheet(html){ $('#glass').innerHTML = html; $('#scrim').classList.add('on'); $('#glass').classList.add('on'); }
function wireBoard(){
  const app = $('#app');
  app.querySelectorAll('[data-bpage]').forEach(x=>x.onclick=()=>{ bState().active = x.dataset.bpage; bSave(); render(); });
  app.querySelectorAll('[data-bsym]').forEach(x=>x.onclick=()=>{ if(BEDIT) return; SYM=x.dataset.bsym; store.set('sym',SYM); render(); });
  app.querySelectorAll('[data-bsess]').forEach(x=>x.onclick=()=>{ if(BEDIT) return; setView(x.dataset.bsess, true); });
  app.querySelectorAll('[data-bdel]').forEach(x=>x.onclick=()=>{ const pg=bPage(); pg.widgets = bCompact(pg.widgets.filter(w=>w.id!==x.dataset.bdel)); bSave(); render(); });
  app.querySelectorAll('[data-bfit]').forEach(x=>x.onclick=()=>{ const pg=bPage(), w=pg.widgets.find(z=>z.id===x.dataset.bfit), el=x.closest('.bw'); if(!w||!el) return;
    const need = el.querySelector('.bwh').offsetHeight + el.querySelector('.bwb').scrollHeight + 6;
    const old = pg.widgets.map(z=>({...z})), lim = Math.max(bRows(), bBottom(old));
    w.h = Math.max(2, Math.min(30, Math.ceil((need + B_GAP) / BRH))); bCompact(pg.widgets);
    if(bBottom(pg.widgets) > lim){ pg.widgets.forEach((z,i)=>Object.assign(z, old[i])); toast('Not enough room below. Make a widget smaller first.'); return; }
    bPlace(); bSave(); });
  app.querySelectorAll('[data-bact]').forEach(x=>x.onclick=()=>bAct(x.dataset.bact));
  // how many rows each widget shows, so its text can scale to fill the box
  app.querySelectorAll('.bwb').forEach(x=>{ const g = x.querySelector('.bgrid');
    const n = g ? Math.ceil(g.children.length / (getComputedStyle(g).gridTemplateColumns.split(' ').length||1)) : x.querySelectorAll(':scope > .brow, :scope > .bsym').length;
    x.style.setProperty('--n', Math.max(1, n)); });
  bPlace(); bWatch(); requestAnimationFrame(()=>bFitText($('#board')));
  if(BEDIT) bDrag();
}

function bAct(a){
  const st = bState(), pg = bPage(), dev = bDev();
  if(a==='pick') return openPicker();
  if(a==='edit'){ BEDIT = true; return render(); }
  if(a==='done'){ BEDIT = false; bSave(); toast(BSYNC ? 'Saved to your account.' : 'Saved on this device.'); return render(); }
  if(a==='full'){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){ toast('Full screen isn\'t available in this browser.'); } return; }
  if(a==='add') return bSheet(`<h4><span>Add a widget</span><span>${esc(pg.name)}</span></h4><div class="bpick">${Object.entries(BW).map(([k,v])=>`<button data-badd="${k}">${esc(v.name)}</button>`).join('')}</div>`), wireSheet();
  if(a==='newpage') return bSheet(`<h4><span>New page</span><span>${dev==='mobile'?'Phone':'Desktop'}</span></h4>
      <div class="bpick"><button data-bnew="blank">Blank page</button>${Object.entries(BPRESETS[dev]).map(([k,v])=>`<button data-bnew="${k}">From preset: ${esc(v.name)}</button>`).join('')}</div>`), wireSheet();
  if(a==='menu') return bSheet(`<h4><span>${esc(pg.name)}</span><span>${st.pages.length} page${st.pages.length>1?'s':''}</span></h4>
      <div class="bpick"><button data-bm="rename">Rename</button><button data-bm="dup">Duplicate</button>
      ${Object.entries(BPRESETS[dev]).map(([k,v])=>`<button data-bm="preset:${k}">Use preset: ${esc(v.name)}</button>`).join('')}
      <button data-bm="reset">Restore default pages</button>${st.pages.length>1?'<button data-bm="del" style="color:var(--down)">Delete this page</button>':''}</div>`), wireSheet();
}
function wireSheet(){
  const st = bState(), pg = bPage(), dev = bDev();
  $$('#glass [data-badd]').forEach(x=>x.onclick=()=>{ const t=x.dataset.badd, [w,h]=BW[t][dev==='mobile'?'m':'d'];
    const nw = {id:bid(), type:t, w:Math.min(w,bCols(dev)), h, x:null, y:null}, before = pg.widgets.map(z=>({...z}));
    pg.widgets.push(nw); bFlow(pg.widgets, bCols(dev));
    if(bBottom(pg.widgets) > Math.max(bRows(), bBottom(before))){ nw.h = 3; nw.x = nw.y = null; pg.widgets.forEach((z,i)=>{ if(before[i]) Object.assign(z, before[i]); }); bFlow(pg.widgets, bCols(dev)); }
    if(bBottom(pg.widgets) > Math.max(bRows(), bBottom(before))){ pg.widgets.pop(); pg.widgets.forEach((z,i)=>Object.assign(z, before[i])); toast('This page is full. Make a widget smaller or start a new page.'); return; }
    bSave(); closeGlass(); render(); setTimeout(()=>{ const el=document.querySelector(`.bw[data-wid="${nw.id}"]`); if(el) el.scrollIntoView({block:'center', behavior:'smooth'}); }, 50); });
  $$('#glass [data-bnew]').forEach(x=>x.onclick=()=>{ const k=x.dataset.bnew;
    if(st.pages.length>=12){ toast('Up to 12 pages per device.'); return; }
    const p = k==='blank' ? {id:bid(), name:'Page '+(st.pages.length+1), widgets:[]} : bFromPreset(dev, k);
    st.pages.push(p); st.active = p.id; BEDIT = k==='blank'; bSave(); closeGlass(); render(); });
  $$('#glass [data-bm]').forEach(x=>x.onclick=()=>{ const k=x.dataset.bm;
    if(k==='rename'){ const n = prompt('Page name', pg.name); if(n && n.trim()){ pg.name = n.trim().slice(0,40); } }
    else if(k==='dup'){ if(st.pages.length>=12){ toast('Up to 12 pages per device.'); return; }
      const p = {id:bid(), name:(pg.name+' copy').slice(0,40), widgets:pg.widgets.map(w=>({...w, id:bid()}))}; st.pages.splice(st.pages.indexOf(pg)+1, 0, p); st.active = p.id; }
    else if(k.startsWith('preset:')){ pg.widgets = bFromPreset(dev, k.slice(7)).widgets; }
    else if(k==='reset'){ if(!confirmInline(x, 'Tap again to replace this device\'s pages with the default.')) return; BL[dev] = bDefault()[dev]; BEDIT = false; }
    else if(k==='del'){ if(!confirmInline(x, 'Tap again to delete this page.')) return; st.pages = st.pages.filter(p=>p.id!==pg.id); st.active = st.pages[0].id; }
    bSave(); closeGlass(); render(); });
}

function confirmInline(btn, msg){ if(btn.dataset.arm) return true; btn.dataset.arm = 1; btn.textContent = msg; return false; }
// Positions: x and width as fractions of the board (so it fits any window), y and height in fixed rows.
function bRect(w, cols){ return {left:`calc(${w.x} * (100% + var(--gap)) / ${cols})`, width:`calc(${w.w} * (100% + var(--gap)) / ${cols} - var(--gap))`,
  top:(w.y*BRH)+'px', height:(w.h*BRH - B_GAP)+'px'}; }
function bFitText(root){   // widgets never scroll: show as many whole items as fit; make the box bigger to see more
  (root||document).querySelectorAll('.bwb').forEach(x=>{

      ${rec.length?`<div class="l20">${rec.map(r=>`<i title="${r.date}: ${r.bias}, ${r.result}" style="background:${r.result==='hit'?up:r.result==='miss'?dn:'var(--bar)'}"></i>`).join('')}</div>
      ${sc.streak&&sc.streak.n?`<span class="qk">streak <span style="color:${sc.streak.kind==='hit'?up:dn}">${sc.streak.n} ${sc.streak.kind==='hit'?'right':'wrong'}</span></span>`:''}`:'<span class="qk">nothing graded yet</span>'}</div></div>`;
  // what's next

  S.method = `<section class="foot">
    <p>Three sessions, each with its own call: <b>Asia</b> (Tokyo 9 AM–3 PM), <b>London</b> (8 AM–4:30 PM London time) and <b>New York</b> (9:30 AM–4 PM New York time). Each call is ready before its session opens, locks 10 minutes before the open, and is re-checked while the session runs. It only changes on a material shift, and when it does you'll see an Updated note.</p>

function nextWeekdayISO(iso){ const d=new Date(iso+'T12:00:00'); do{ d.setDate(d.getDate()+1); }while([0,6].includes(d.getDay())); return d.toISOString().slice(0,10); }

/* ───────── LEVELS ───────── */
function pageLevels(D){
  const m=D.markets[SYM], L=m.levels||{}, R=m.expected_range, Dl=m.dealer, F=m.flow;
  let h = `<div class="ptitle">Levels</div><div class="psub">${esc(SYM)} prices as of ${tET(new Date(D.as_of))}, ${dayOf(D.date)}. From CBOE open interest, mapped to futures.</div>`;
  h += `<section><h2>Key levels</h2><div class="card rows">
      <div class="r"><span>Futures at cutoff</span><span>${fmt(L.price)}</span></div>
      ${L.call_wall?`<div class="r"><span>Call wall<small>resistance</small></span><span style="color:var(--up)">${fmt(L.call_wall,0)}</span></div>`:''}
      ${L.flip?`<div class="r"><span>Gamma flip<small>range above, trend below</small></span><span>${fmt(L.flip)}</span></div>`:''}
      ${L.flip_close?`<div class="r"><span>Flip at 4 PM</span><span>${fmt(L.flip_close)}</span></div>`:''}
      ${L.put_wall?`<div class="r"><span>Put wall<small>support</small></span><span style="color:var(--down)">${fmt(L.put_wall,0)}</span></div>`:''}
      ${R?`<div class="r"><span>Expected range (1σ)</span><span>${fmt(R.low,0)} – ${fmt(R.high,0)}<small>± ${fmt(R.move,0)} pts</small></span></div>`:''}
      ${(L.majors||[]).map(x=>`<div class="r"><span>Major ${x.net_gex>0?'+γ':'−γ'} level</span><span style="color:${x.net_gex>0?'var(--up)':'var(--down)'}">${fmt(x.level,0)}</span></div>`).join('')}
    </div>
    <div class="btnrow"><button class="btn" id="copyLv">Copy levels</button></div></section>`;
  if(!L.flip && !L.call_wall) h += `<section><div class="card pad" style="color:var(--dim);font-size:14px;line-height:1.5">No dealer levels for this read: the free feed didn't have that morning's open interest. Price and the volatility range are still shown.</div></section>`;
  if(m.profile && m.profile.length) h += `<section><h2>Dealer gamma profile</h2><div class="card pad">${profile(m.profile,L)}</div></section>`;
  if(Dl){ const lg=Dl.net_gex_bn>0;
    h += `<section><h2>Dealer positioning <span class="pill" style="color:${lg?'var(--up)':'var(--down)'}">${lg?'Long gamma':'Short gamma'}</span></h2><div class="card rows">
      <div class="r"><span>Net GEX (per 1% move)</span><span style="color:${lg?'var(--up)':'var(--down)'}">${usd(Dl.net_gex_bn)}B</span></div>
      <div class="r"><span>Call ÷ put gamma</span><span>${fmt(Dl.call_put_gamma)}</span></div>
      <div class="r"><span>Dealer option delta</span><span>${usd(Dl.dealer_delta_bn,1)}B</span></div>
      <div class="r"><span>Charm hedge flow to close</span><span style="color:${Dl.charm_bn>0?'var(--up)':'var(--down)'}">${Dl.charm_bn>0?'Buy':'Sell'} ${usd(Math.abs(Dl.charm_bn))}B</span></div>
      <div class="r"><span>Vanna per +1 vol pt</span><span>${usd(Dl.vanna_bn_per_pt)}B Δ</span></div>
      <div class="r"><span>Chains used</span><span>${Dl.chains.join(' + ')}</span></div></div></section>`; }
  if(F && (F.calls_m+F.puts_m)>0){ const cp=(F.calls_m/(F.calls_m+F.puts_m)*100).toFixed(1);
    h += `<section><h2>Options flow, prior session</h2><div class="card pad">
      <div class="flowbar"><div style="width:${cp}%;background:var(--up)"></div><div style="flex:1;background:var(--down)"></div></div>
      <div class="fl"><span style="color:var(--up)">Calls $${fmt(F.calls_m,1)}M</span><span style="color:var(--down)">Puts $${fmt(F.puts_m,1)}M</span></div>
      <div class="rows" style="margin:12px calc(-1*var(--pad)) calc(-1*var(--pad));border-top:1px solid var(--line)">
      ${F.top.map(t=>`<div class="r"><span>${fmt(t.level,0)} ${t.side}s</span><span style="color:${t.side==='call'?'var(--up)':'var(--down)'}">$${fmt(t.premium/1e6,1)}M</span></div>`).join('')}</div></div></section>`; }
  return h;
}
function copyLevels(){
  const D=readFor(), m=D.markets[SYM], L=m.levels||{}, R=m.expected_range;
  const lines=[`${SYM} levels · ${D.date} · ${tET(new Date(D.as_of))} · ${m.bias.bias} (${m.bias.conviction})`];
  if(L.call_wall) lines.push(`Call wall ${fmt(L.call_wall,0)}`);
  if(L.flip) lines.push(`Gamma flip ${fmt(L.flip,2)}`);
  if(L.put_wall) lines.push(`Put wall ${fmt(L.put_wall,0)}`);
  (L.majors||[]).forEach(x=>lines.push(`Major ${x.net_gex>0?'+':'−'}γ ${fmt(x.level,0)}`));
  if(R) lines.push(`Range ${fmt(R.low,0)} – ${fmt(R.high,0)}`);
  const txt=lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Levels copied'))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); toast('Levels copied');}catch(e){} t.remove(); });
}
function profile(pts,L){
  const W=520,H=150,p=6, xs=pts.map(d=>d.px), ys=pts.map(d=>d.gex);
  const x0=Math.min(...xs),x1=Math.max(...xs),ym=Math.max(...ys.map(Math.abs))||1;
  const X=v=>p+(v-x0)/(x1-x0)*(W-2*p), Y=v=>H/2-v/ym*(H/2-14);
  const path=pts.map((d,i)=>(i?'L':'M')+X(d.px).toFixed(1)+','+Y(d.gex).toFixed(1)).join('');
  const area=path+`L${X(x1)},${H/2}L${X(x0)},${H/2}Z`;
  const vline=(v,c,t)=>v==null||v<x0||v>x1?'':`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${H-4}" stroke="${c}" stroke-width="1.2" ${t==='now'?'':'stroke-dasharray="3 3"'}/><text x="${X(v)+3}" y="${t==='now'?H-8:12}" fill="${c}" font-size="10" font-family="-apple-system,system-ui,sans-serif">${t}</text>`;
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><clipPath id="cu"><rect width="${W}" height="${H/2}"/></clipPath><clipPath id="cd"><rect y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    <path d="${area}" fill="var(--up)" opacity=".2" clip-path="url(#cu)"/><path d="${area}" fill="var(--down)" opacity=".2" clip-path="url(#cd)"/>
    <path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.4" opacity=".8"/>
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line2)"/>${vline(L.flip,'var(--amber)','flip')}${vline(L.price,'var(--text)','now')}
  </svg><div class="meter-l" style="margin-top:6px"><span>${fmt(x0,0)}</span><span>long gamma above, short below</span><span>${fmt(x1,0)}</span></div>`;
}

function pageRecord(D){

        <div><span>Streak</span><b style="color:${st.kind==='hit'?'var(--up)':'var(--down)'}">${st.n||0}</b><small>${st.kind==='hit'?'in a row right':st.kind==='miss'?'in a row wrong':'—'}</small></div></section>`;

  h += `<section><h2>By conviction</h2><div class="card rows">${['High','Medium','Low','Very low'].filter(c=>sc.by_conviction[c]).map(c=>barRow(c+' conviction',sc.by_conviction[c])).join('')}</div></section>`;
  const recent=sc.recent||[];
  h += `<section><h2>Last ${recent.length} sessions</h2><div class="card"><div class="dots">${recent.map(r=>`<span title="${r.date}" style="background:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--line2)'}">${r.bias[0]}</span>`).join('')}</div>

  return h;

  if(!R) return h + `<section><div class="card pad" style="color:var(--dim)">No previews yet. They're built with the next run.</div></section>`;
  const today = todayET(), rel = R.releases||[];

        <div class="kicker">${FOLDER('var(--down)')}${kicker}: ${esc(p.lean)}</div>

        <p class="note">${esc(p.why)}</p>
      </div>
      <div class="card" style="margin-top:10px">${p.votes.map(v=>`<div class="sig"><div class="sig-h"><h3>${esc(v.label)}</h3><span class="chip" style="color:${v.score>0?'var(--down)':'var(--up)'}">${v.score>0?(p.name==='FOMC'?'hawkish':'hotter'):(p.name==='FOMC'?'dovish':'cooler')}</span></div>${P.reasons?`<p>${esc(v.text)}</p>`:''}</div>`).join('')}</div>`;
  for(const r of rel){
    const isToday = r.date===today, when = `${isToday?'Today':dayOf(r.date)}, ${r.time==='All day'?'All day':evCT(r.ts)}`;
    const fc = (r.forecasts||[]).filter(f=>f.forecast||f.previous).map(f=>`${esc(f.title)}: forecast ${esc(f.forecast||'—')}, previous ${esc(f.previous||'—')}`).join('<br>');

      ${r.preview ? card(r.preview, r.kind==='fomc'?'Expected tone':'Expected print')
        : `<div class="card pad" style="color:var(--sub)">${FOLDER('var(--down)')} ${esc(r.note)}</div>`}</section>`;
  }
  for(const key of ['fomc','cpi']){
    const p = R.previews[key]; if(!p || rel.some(r=>r.kind===key)) continue;

  }
  const ev = R.events||[];

async function loadExm(){ EXM_AT=Date.now(); try{ EXM=await fetch('data/expmove.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()); }catch(e){ EXM=EXM||{error:true,markets:{}}; } if(PAGE==='expmove') render(); }
const cdTxt = ms => { if(ms<=0) return 'now'; const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), x=s%60;
  return d? `${d}d ${h}h ${m}m` : h? `${h}h ${m}m ${String(x).padStart(2,'0')}s` : `${m}m ${String(x).padStart(2,'0')}s`; };
const evCT = ts => new Date(ts).toLocaleTimeString('en-US',{timeZone:USER_TZ,hour:'numeric',minute:'2-digit'})+' '+TZ_LABEL;
const evDay = ts => new Date(ts).toLocaleDateString('en-US',{timeZone:USER_TZ,weekday:'long',month:'short',day:'numeric'});
const evKey = ts => new Date(ts).toLocaleDateString('en-CA',{timeZone:USER_TZ});
setInterval(()=>{ document.querySelectorAll('[data-cd]').forEach(e=>{ e.textContent=cdTxt(new Date(e.dataset.cd)-Date.now()); }); },1000);
function calNext(imp){ if(!CAL||!CAL.events) return null; const now=Date.now(); return CAL.events.find(e=>!e.all_day && new Date(e.ts)>now && (!imp||e.impact===imp)) || null; }

  return `<div class="calb"><span class="dot"></span><div><b>${esc(e.title)}</b> at ${evCT(e.ts)}<small>${ms<15*60e3?'Avoid new entries until it prints. ':''}Red folder release</small></div><b class="num" data-cd="${e.ts}">${cdTxt(ms)}</b></div>`; }

    <div class="r"><span>1σ (68% of days)<small>about 1.25 times the straddle</small></span><span>±${e.sigma_pts==null?'—':fmt(e.sigma_pts,0)}</span></div>

function pageGammaMap(){
  const rows = ((ROOT && ROOT.gamma_map) || {})[SYM] || [];
  let h = `<div class="ptitle">Gamma map</div><div class="psub">${esc(SYM)} dealer levels from each morning's pre-open read: are the walls and flip moving up or down?</div>`;
  if(rows.length < 2) return h + `<section><div class="card pad" style="color:var(--sub)">${rows.length?'One morning so far.':'No mornings with options data yet.'} The map fills in as each pre-open read locks.</div></section>` + (rows.length?gmTable(rows):'');
  const W=340, H=200, P=30, vals = rows.flatMap(r=>[r.call_wall,r.put_wall,r.flip,r.price]).filter(v=>v!=null);
  const lo=Math.min(...vals), hi=Math.max(...vals), pad=(hi-lo)*0.08||10;
  const x = i => P + i*(W-P-8)/(rows.length-1), y = v => 8 + (1-(v-lo+pad)/(hi-lo+2*pad))*(H-28);
  const line = (k,col,dash) => { const pts = rows.map((r,i)=>r[k]!=null?`${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`:null).filter(Boolean);
    return pts.length>1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>` : ''; };
  const dots = rows.map((r,i)=>r.price!=null?`<circle cx="${x(i).toFixed(1)}" cy="${y(r.price).toFixed(1)}" r="3" fill="var(--text)"/>`:'').join('');
  const ticks = [hi, (hi+lo)/2, lo].map(v=>`<text x="2" y="${y(v)+4}" font-size="10" fill="var(--dim)">${fmt(v,0)}</text>`).join('');
  const dl = rows.map((r,i)=> (i===0||i===rows.length-1||i%Math.ceil(rows.length/5)===0) ? `<text x="${x(i)}" y="${H-4}" font-size="10" fill="var(--dim)" text-anchor="${i===rows.length-1?'end':i===0?'start':'middle'}">${r.date.slice(5).replace('-','/')}</text>`:'').join('');
  h += `<section><div class="card pad"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${ticks}${line('call_wall','var(--up)')}${line('put_wall','var(--down)')}${line('flip','var(--amber)',1)}${dots}${dl}</svg>
    <div style="display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap"><span><b style="color:var(--up)">━</b> Call wall</span><span><b style="color:var(--down)">━</b> Put wall</span><span><b style="color:var(--amber)">╍</b> Flip</span><span><b>●</b> Price at 8:25</span></div></div></section>`;
  const a=rows[rows.length-1], b=rows[Math.max(0,rows.length-6)], d=(k)=>a[k]!=null&&b[k]!=null?a[k]-b[k]:null;
  const ch = [['Call wall',d('call_wall')],['Put wall',d('put_wall')],['Flip',d('flip')]].filter(x=>x[1]!=null);
  if(ch.length) h += `<section><h2>Since ${b.date.slice(5).replace('-','/')}</h2><div class="card rows">${ch.map(([n,v])=>`<div class="r"><span>${n}</span><span class="num" style="color:${v>0?'var(--up)':v<0?'var(--down)':'var(--sub)'}">${v>0?'+':v<0?'−':''}${fmt(Math.abs(v),0)} pts</span></div>`).join('')}</div></section>`;
  return h + gmTable(rows);
}
function gmTable(rows){

function spark(pts, col){

function squarify(items, x, y, w, h){   // items: [{v,...}] sorted desc → [{...,x,y,w,h}]
  const out=[]; let rest=items.slice(), X=x, Y=y, W=w, H=h;
  const total = a => a.reduce((s,i)=>s+i.v,0);
  while(rest.length){
    const side = Math.min(W,H), S = total(rest); let row=[], best=Infinity;
    for(const it of rest){ const r=[...row,it], rs=total(r), a=rs/S*W*H, len=a/side;
      const worst=Math.max(...r.map(i=>{ const s=i.v/rs*side; return Math.max(len/s, s/len); }));
      if(worst<=best){ row=r; best=worst; } else break; }
    const rs=total(row), a=rs/S*W*H, len=a/side; let off=0;
    for(const it of row){ const s=it.v/rs*side;
      out.push(W>=H ? {...it, x:X, y:Y+off, w:len, h:s} : {...it, x:X+off, y:Y, w:s, h:len}); off+=s; }
    if(W>=H){ X+=len; W-=len; } else { Y+=len; H-=len; }
    rest = rest.slice(row.length);
  }
  return out;
}

          const f=(p.r-rin)/(rout-rin), dop=1+.75*ca;                     // left side (cos>0 after flip) comes toward us: brighter
          const x=X-ca*p.r, y=Y+sa*p.r*tilt+p.h, len=Math.min(.35, 6/p.r*(1+S.speed));
          cx.strokeStyle=css(this.temp(f), Math.min(1,(.12+.42*(1-f))*p.b*dop*S.glow)); cx.lineWidth=(1.5-.8*f)*Math.max(.6,S.size*.8);
          cx.beginPath(); cx.ellipse(X,Y+p.h,p.r,p.r*tilt,0,p.a-len,p.a); cx.stroke();
          if(!front && f<.7){                       // the same far-side gas, lensed into a bow over the shadow
            const rr=rs*1.32+f*rs*1.15, rx=rr*1.16, phi=TAU-Math.acos(Math.max(-1,Math.min(1,-ca)));
            cx.strokeStyle=css(this.temp(f*.9), Math.min(1,(.07+.3*(1-f))*p.b*dop*S.glow)); cx.lineWidth=1-.4*f;
            cx.beginPath(); cx.ellipse(X,Y,rx,rr,0,phi-len*.8,phi); cx.stroke();
            if(f<.35){ cx.strokeStyle=css(this.temp(f), .05*p.b*S.glow);     // faint second image under the hole
              cx.beginPath(); cx.ellipse(X,Y,rx*.92,rr*.8,0,TAU-phi-len*.6,TAU-phi); cx.stroke(); } }
        } };
      pass(false);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
      const sh=cx.createRadialGradient(X,Y,rs*.9,X,Y,rs*1.25); sh.addColorStop(0,'#000'); sh.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=sh; cx.beginPath(); cx.arc(X,Y,rs*1.25,0,TAU); cx.fill();
      cx.globalCompositeOperation='lighter';
      cx.strokeStyle=css(this.temp(.05),.07*S.glow); cx.lineWidth=5; cx.beginPath(); cx.arc(X,Y,rs*1.05,0,TAU); cx.stroke();   // photon ring: soft glow
      cx.strokeStyle=css(this.temp(0),.32*S.glow); cx.lineWidth=.9; cx.beginPath(); cx.arc(X,Y,rs*1.03,0,TAU); cx.stroke();
      pass(true);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1; }
  },
  aurora:{
    init(){ const c=rgb(tint()); this.c=[c, mix(c,[120,120,255],.55), mix(c,[255,120,200],.4)]; },
    frame(dt,t){
      cx.fillStyle='#02040a'; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      const T = t*.18*S.speed, step = 4;
      this.c.forEach((c,k)=>{ const base = H*(.22+k*.17), amp = 34*S.size;
        for(let x=0;x<W;x+=step){
          const y = base + Math.sin(x*.012+T*(1+k*.3)+k)*amp + Math.sin(x*.031-T*1.7+k*2)*amp*.45;
          const h = (130+80*Math.sin(x*.02+T*2+k))*S.size*(.6+.4*S.amount);
          const a = (.22+.14*Math.sin(x*.05+T*3+k))*S.glow;
          const gr = cx.createLinearGradient(0,y-h,0,y); gr.addColorStop(0,css(c,0)); gr.addColorStop(.8,css(c,a)); gr.addColorStop(1,css(c,0));
          cx.fillStyle=gr; cx.fillRect(x,y-h,step,h); } });
      cx.globalCompositeOperation='source-over'; }
  },
  stars:{
    init(){ const c=rgb(tint()); this.c=c; sprites={d:glowSprite(c,8), s:starSprite(c)};
      this.s = Array.from({length:n(160)},()=>({x:R()*W,y:R()*H,z:R(),ph:R()*TAU,f:.5+R()*2}));
      this.sh = null; this.next = 1+R()*3; },
    frame(dt,t){
      const g=cx.createRadialGradient(W*.5,H*1.1,0,W*.5,H*.6,H*1.1); g.addColorStop(0,css(mix([12,14,30],this.c,.12))); g.addColorStop(1,'#010207');
      cx.fillStyle=g; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      for(const s of this.s){ s.y += (2+6*s.z)*dt*S.speed; if(s.y>H+4){s.y=-4;s.x=R()*W;}
        cx.globalAlpha = (.25+.75*Math.sin(t*s.f+s.ph)**2)*(.3+.7*s.z)*S.glow; const r=(1+2.6*s.z)*S.size; cx.drawImage(sprites.d,s.x-r,s.y-r,r*2,r*2); }
      this.next -= dt*S.speed*S.amount;
      if(!this.sh && this.next<0){ this.sh={x:R()*W*.8+W*.2,y:R()*H*.4,vx:-(260+R()*160),vy:120+R()*80,life:0}; this.next=2+R()*5; }
      if(this.sh){ const s=this.sh; s.life+=dt*S.speed; s.x+=s.vx*dt*S.speed; s.y+=s.vy*dt*S.speed;
        const a=Math.max(0,1-s.life/1.1)*S.glow; const gr=cx.createLinearGradient(s.x,s.y,s.x-s.vx*.25,s.y-s.vy*.25);
        gr.addColorStop(0,css(mix(this.c,[255,255,255],.7),a)); gr.addColorStop(1,css(this.c,0));
        cx.strokeStyle=gr; cx.lineWidth=2*S.size; cx.lineCap='round'; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*.25,s.y-s.vy*.25); cx.stroke();
        cx.globalAlpha=a; cx.drawImage(sprites.s,s.x-12,s.y-12,24,24); if(s.life>1.1) this.sh=null; }
      cx.globalAlpha=1; cx.globalCompositeOperation='source-over'; }
  },
  off:{ init(){}, frame(){ const g=cx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0b0d16'); g.addColorStop(1,'#05060b'); cx.fillStyle=g; cx.fillRect(0,0,W,H); } }
};

  let raf = 0, last = 0, t = 0, running = false, built = '';
  function size(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cx.setTransform(DPR,0,0,DPR,0,0); }
  function build(){ size(); scene = SCENES[S.style]; scene.init(); built = [S.style, tint(), S.amount, S.size, W, H].join('|'); }
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000) * (reduce ? .25 : 1); last = now; t += dt;
    scene.frame(dt, t); raf = requestAnimationFrame(loop);
  }
  function start(){ if(running || document.hidden) return; running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  function config(p, call){
    Object.assign(S, {style:p.fx||'off', tint:p.fxTint||'style', speed:+p.fxSpeed||1, amount:+p.fxAmount||1, size:+p.fxSize||1, glow:+p.fxGlow||1, call:call||'Bearish'});
    if(S.style==='off' || !SCENES[S.style]){ stop(); cv.hidden = true; return; }
    cv.hidden = false;
    if([S.style, tint(), S.amount, S.size, window.innerWidth, window.innerHeight].join('|') !== built) build();
    start();
  }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(S.style!=='off') start(); });
  let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(S.style!=='off') build(); }, 200); });
  return { config };
})();

/* ───────── settings sheet ───────── */
function seg(key, opts, label){
  return `<div class="st"><h4>${label}</h4><div class="seg">${Object.entries(opts).map(([v,t])=>
    `<button data-k="${key}" data-v="${v}" class="${String(P[key])===v?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function openSettings(){
  closeGlass();
  const t = THEMES[P.theme]||THEMES.classic;
  $('#sheetIn').innerHTML = `
    <div class="sh-top"><h3>Settings</h3><button class="hbtn" id="done">Done</button></div>
    <div class="st"><h4>Colors</h4><div class="seg">${Object.entries(THEMES).map(([k,v])=>
      `<button data-k="theme" data-v="${k}" class="${P.theme===k&&!P.up&&!P.down?'on':''}"><span class="sw"><i style="background:${v.up}"></i><i style="background:${v.down}"></i></span>${v.name}</button>`).join('')}</div>
      <div class="colors"><label>Bullish <input type="color" id="cUp" value="${P.up||t.up}"></label><label>Bearish <input type="color" id="cDown" value="${P.down||t.down}"></label></div></div>
    ${seg('look', {default:'Default', quant:'Quant desk'}, 'Layout')}
    ${seg('bg', BG_CHOICES, P.fx!=='off' ? 'Background color (when animation is off)' : 'Background color')}
    ${seg('fx', FX_STYLES, 'Animated background')}
    ${P.fx!=='off' ? `<div class="st"><h4>Animation color</h4><div class="seg">${Object.entries(FX_TINTS).map(([v,t])=>
      `<button data-k="fxTint" data-v="${v}" class="${P.fxTint===v?'on':''}">${v.startsWith('#')?`<span class="sw"><i style="background:${v}"></i></span>`:''}${t}</button>`).join('')}</div></div>
    <div class="st rng">${[['fxSpeed','Speed',.1,2.5],['fxAmount','Amount',.2,2.5],['fxSize','Size',.5,2],['fxGlow','Brightness',.2,1.8]].map(([k,l,mn,mx])=>
      `<label for="r-${k}"><span>${l}</span><output id="o-${k}">${Math.round(P[k]*100)}%</output></label><input type="range" id="r-${k}" data-r="${k}" min="${mn}" max="${mx}" step="0.05" value="${P[k]}">`).join('')}</div>` : ''}
    ${seg('size', {s:'Small', m:'Medium', l:'Large'}, 'Text size')}
    ${seg('density', {comfortable:'Comfortable', compact:'Compact'}, 'Layout')}
    ${seg('reasons', {true:'Show data', false:'Headlines only'}, 'Reason detail')}
    ${seg('market', {NQ:'NQ', ES:'ES'}, 'Open on')}
    ${seg('start', {today:'Today', board:'My pages'}, 'Start page')}
    <div class="st"><h4>Today page sections</h4><div class="card">${P.order.map((k,i)=>`
      <div class="secrow"><span>${SECTIONS[k]}</span>
        <button class="mv" data-mv="${i}" data-d="-1" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
        <button class="mv" data-mv="${i}" data-d="1" ${i===P.order.length-1?'disabled style="opacity:.3"':''}>↓</button>
        <button class="tg ${P.hidden.includes(k)?'':'on'}" data-tg="${k}" aria-label="Show ${SECTIONS[k]}"></button></div>`).join('')}</div></div>
    <button class="reset" id="reset">Reset to defaults</button>`;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSettings(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function changed(){ save(); applyPrefs(); if(ROOT) render(); const y=$('#sheet').scrollTop; openSettings(); $('#sheet').scrollTop=y; }
$('#sheet').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='done') return closeSettings();
  if(b.id==='reset'){ P={...DEFAULTS, order:[...DEFAULTS.order], hidden:[]}; SYM=P.market; return changed(); }
  if(b.dataset.k){ let v=b.dataset.v; if(v==='true'||v==='false') v=(v==='true');
    P[b.dataset.k]=v; if(b.dataset.k==='fx') P.fxSet=true; if(b.dataset.k==='bg') P.bgSet=true; if(b.dataset.k==='theme'){P.up=null;P.down=null;} if(b.dataset.k==='market') SYM=v; return changed(); }
  if(b.dataset.mv){ const i=+b.dataset.mv, j=i+(+b.dataset.d); [P.order[i],P.order[j]]=[P.order[j],P.order[i]]; return changed(); }
  if(b.dataset.tg){ const k=b.dataset.tg; P.hidden = P.hidden.includes(k) ? P.hidden.filter(x=>x!==k) : [...P.hidden,k]; return changed(); }
});
$('#sheet').addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.r;
  if(k){ P[k] = +e.target.value; const o=$('#o-'+k); if(o) o.textContent = Math.round(P[k]*100)+'%'; save(); try{ FX.config(P, CALL); }catch(err){} return; }
  if(e.target.id==='cUp'){ P.up=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
  if(e.target.id==='cDown'){ P.down=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
});
$('#gear').onclick = openSettings;
$('#scrim').onclick = () => { closeGlass(); closeSettings(); closePop(); };
$('#popX').onclick = closePop;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePop(); });
$('#refresh').onclick = () => load(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
applyPrefs(); shell(); load(); bPull();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
// Self-update: if a newer app version is published, drop every cached copy and reload once.
const APP_VER = '88';
async function checkVersion(){
  try{
    const v = (await (await fetch('version.txt?t='+Date.now(), {cache:'no-store'})).text()).trim();
    if(v && v !== APP_VER && sessionStorage.getItem('reloadedFor') !== v){
      try{ sessionStorage.setItem('reloadedFor', v); }catch(e){}
      if(window.caches) for(const k of await caches.keys()) await caches.delete(k);
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(reg) await reg.update();
      location.replace(location.pathname + '?v=' + v);
    }
  }catch(e){}
}
checkVersion(); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkVersion(); });
</script>
