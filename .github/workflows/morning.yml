name: Morning bias report

on:
  schedule:
    # New York pre-open: every 15 min from 12:07 to 14:52 UTC (8:07 to 9:22 ET in both daylight and standard time)
    - cron: "7,22,37,52 12,13,14 * * 1-5"
    # Live re-checks and previews for whichever session is open (Asia, London, New York): every 30 min, Sun to Fri
    - cron: "10,40 * * * 0-5"
    # Extra re-checks during New York hours, so news shows up within ~15 min
    - cron: "25,55 14,15,16,17,18,19,20 * * 1-5"
    # Locks: London's call 10 min before 8:00 London time, Asia's 10 min before 9:00 Tokyo time
    - cron: "45 6,7 * * 1-5"
    - cron: "45 22,23 * * 0-4"
    # Before the 5 PM CT Globex reopen, Sunday to Thursday (evening previews and the Sunday gap)
    - cron: "20,50 20,21,22 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "Rebuild a past morning (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      backfill:
        description: "Rebuild a range of past mornings (YYYY-MM-DD:YYYY-MM-DD), last ~55 days. Days with a live record are kept."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build report
        env:
          REPORT_DATE: ${{ github.event.inputs.date }}
          REPORT_BACKFILL: ${{ github.event.inputs.backfill }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_report.py
      - name: Publish
        run: |
          git config user.name  "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Report $(date -u +%Y-%m-%d\ %H:%M)Z"
          # Data files are regenerated every run, so if another commit landed meanwhile,
          # keep this run's fresh data on conflict ("theirs" = our commit during a rebase) and retry.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Publish failed after retries"; exit 1
